# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # 10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          ignore-nothing-to-cache: true
      - name: Dependencies
        run: uv sync
      - name: Linter
        run: poe lint
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          GOOGLEDRIVEFS_TEST_CLIENT_ID: ${{ secrets.GOOGLEDRIVEFS_TEST_CLIENT_ID }}
          GOOGLEDRIVEFS_TEST_CLIENT_SECRET: ${{ secrets.GOOGLEDRIVEFS_TEST_CLIENT_SECRET }}
          GOOGLEDRIVEFS_TEST_TOKEN_READ_ONLY: ${{ secrets.GOOGLEDRIVEFS_TEST_TOKEN_READ_ONLY }}
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -z "$GOOGLEDRIVEFS_TEST_CLIENT_ID" ] || [ -z "$GOOGLEDRIVEFS_TEST_CLIENT_SECRET" ] || [ -z "$GOOGLEDRIVEFS_TEST_TOKEN_READ_ONLY" ] || [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "::error::At least one required secret (GOOGLEDRIVEFS_TEST_CLIENT_ID, GOOGLEDRIVEFS_TEST_CLIENT_SECRET, GOOGLEDRIVEFS_TEST_TOKEN_READ_ONLY, NGROK_AUTH_TOKEN) is missing. Forked pull requests do not have access to repository secrets"
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # 10.4.0
        with:
          enable-cache: true
          python-version: 3.15
          activate-environment: true
          ignore-nothing-to-cache: true
      - name: Dependencies
        run: uv sync
      - name: Tests
        env:
          GOOGLEDRIVEFS_TEST_CLIENT_ID: ${{ secrets.GOOGLEDRIVEFS_TEST_CLIENT_ID }}
          GOOGLEDRIVEFS_TEST_CLIENT_SECRET: ${{ secrets.GOOGLEDRIVEFS_TEST_CLIENT_SECRET }}
          GOOGLEDRIVEFS_TEST_TOKEN_READ_ONLY: ${{ secrets.GOOGLEDRIVEFS_TEST_TOKEN_READ_ONLY }}
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: poe test
